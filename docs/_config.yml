# GitHub Pages serves this directory. index.html and ko/index.html are the product pages, written
# as plain HTML; every Markdown page renders through _layouts/default.html, and its source stays
# readable next to it (/install.md), which llms.txt lists. recly.md is the design document, not a
# web page, and its `{{ … }}` samples would fail Jekyll's Liquid pass. The internal notes (App
# Review, store copy, UX audits, research) stay in the repository but off the site. design/ is
# served: the pages use its icon, badges and screenshots.
title: Recly
description: >-
  Open-source audio recorder for Galaxy Watch, Android, Apple Watch, iPhone, macOS and Windows.
  Recordings go to your own Google Drive, iCloud or a local folder; there is no Recly server.
url: https://recly.dev
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - recly.md
  - app-review.md
  - app-store-copy.md
  - app-store-metadata.en.txt
  - mobile-ux-review.md
  - ux-detailed-review.md
  - ux-remediation.md
  - ux-standards-audit.md
  - research/

# Per-page titles and descriptions for search results and link previews. A title that already
# names Recly would read "Recly … | Recly", so those pages get a shorter one here. The English
# privacy policy keeps the extensionless address the app stores and Google's consent screen point
# at; the Korean one cannot (Jekyll would write "privacy-policy.ko" without .html), and GitHub Pages
# serves /policy/privacy-policy.ko from its .html file anyway.
defaults:
  - scope: { path: "" }
    values: { image: /assets/og.png?v=2 }
  - scope: { path: "*.ko.md" }
    values: { lang: ko, locale: ko_KR, image: /assets/og.ko.png }
  - scope: { path: "install.md" }
    values:
      title: Install guide
      description: >-
        Install Recly on Android, Galaxy Watch, iPhone, Apple Watch, Mac and Windows: the stores,
        sideloading, checking a download, updating and uninstalling.
  - scope: { path: "install.ko.md" }
    values:
      title: 설치 안내
      description: >-
        Android, Galaxy Watch, iPhone, Apple Watch, Mac, Windows에 Recly 설치하기: 스토어, 사이드로드,
        다운로드 확인, 업데이트와 제거.
  - scope: { path: "setup.md" }
    values:
      title: Set-up guide
      description: >-
        Set up Recly after installing it: where recordings go (Google Drive, iCloud or a local
        folder), how they are transcribed, permissions, recording and finding your recordings.
  - scope: { path: "setup.ko.md" }
    values:
      title: 설정 안내
      description: >-
        설치 후 Recly 설정하기: 녹음을 저장할 곳(Google Drive, iCloud, 로컬 폴더), 전사 방법, 권한, 녹음하기,
        녹음 찾기.
  - scope: { path: "agent.md" }
    values:
      description: >-
        Have your ChatGPT agent write the minutes by itself whenever a Recly transcript lands in
        Google Drive, with recly-events running on your own computer.
  - scope: { path: "agent.ko.md" }
    values:
      description: >-
        Recly 녹취록이 Google Drive에 올라오면 ChatGPT 에이전트가 스스로 회의록을 쓰게 하기. 내 컴퓨터에서
        recly-events를 실행합니다.
  - scope: { path: "recly-events.md" }
    values:
      description: >-
        Run recly-events yourself, on a Mac, Linux or Windows computer or a server, so your ChatGPT
        agent hears about each new transcript.
  - scope: { path: "recly-events.ko.md" }
    values:
      description: >-
        Mac, Linux, Windows 컴퓨터나 서버에서 recly-events를 직접 실행해 ChatGPT 에이전트가 새 녹취록마다
        알림을 받게 하기.
  - scope: { path: "mcp.md" }
    values:
      title: Local MCP server
      description: >-
        Let Claude Desktop, Claude Code or Codex list, search and read the Recly recordings in a
        local folder or in iCloud on a Mac, with recly-events mcp: no sign-in, no network.
  - scope: { path: "mcp.ko.md" }
    values:
      title: 로컬 MCP 서버
      description: >-
        recly-events mcp로 로컬 폴더나 Mac iCloud의 Recly 녹음을 Claude Desktop, Claude Code, Codex가 목록 보기·검색·
        읽기. 로그인도 네트워크도 없습니다.
  - scope: { path: "faq.md" }
    values:
      description: >-
        Answers to common questions about Recly: cost, devices, accounts, where recordings go,
        on-device transcription, speakers, Windows, updates and reporting a bug.
  - scope: { path: "faq.ko.md" }
    values:
      description: >-
        Recly에 관해 자주 묻는 질문: 비용, 기기, 계정, 녹음이 가는 곳, 온디바이스 전사, 화자 구분, Windows,
        업데이트, 버그 신고.
  - scope: { path: "development.md" }
    values:
      title: Development
      description: >-
        Build and test every Recly client, the values filled in locally, and how releases are cut.
  - scope: { path: "policy/privacy-policy.md" }
    values:
      title: Privacy Policy
      permalink: /policy/privacy-policy
      description: >-
        What Recly handles, where it lives, and every case where data leaves your device. Recly
        has no server.
  - scope: { path: "policy/privacy-policy.ko.md" }
    values:
      title: 개인정보처리방침
      lang: ko
      locale: ko_KR
      image: /assets/og.ko.png
      description: >-
        Recly가 다루는 데이터, 그 데이터가 머무는 곳, 기기 밖으로 나가는 모든 경우. Recly에는 서버가 없습니다.
