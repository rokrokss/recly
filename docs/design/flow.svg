<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Press record on the watch; it hands off to the phone; the phone uploads to your Google Drive and transcribes with your own key; then anything, with your own AI.">
  <!-- README hero: the path from a press on the watch to your own AI. Same palette as icon.svg
       (ground #F7F7F5, surface #FFFFFF, ink #111111, record #DA1E28) so it reads the same on
       GitHub's light and dark pages. Fonts are the system stack: GitHub serves this as an <img>. -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#888884" opacity="0.28"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <style>
      .t  { font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #111111; }
      .title { font-size: 18px; font-weight: 700; }
      .sub   { font-size: 14px; fill: #6B6B68; }
      .band  { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: #6B6B68; }
      .note  { font-size: 13px; fill: #6B6B68; }
      .ink   { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="20" fill="#F7F7F5"/>
  <rect width="1200" height="400" rx="20" fill="url(#dots)"/>

  <!-- bands: what Recly does, what is yours -->
  <g class="t band">
    <line x1="40" y1="64" x2="850" y2="64" stroke="#111111" stroke-width="1.5"/>
    <line x1="40" y1="58" x2="40" y2="70" stroke="#111111" stroke-width="1.5"/>
    <line x1="850" y1="58" x2="850" y2="70" stroke="#111111" stroke-width="1.5"/>
    <rect x="393" y="52" width="104" height="24" fill="#F7F7F5"/>
    <text x="445" y="69" text-anchor="middle">Recly</text>

    <line x1="880" y1="64" x2="1130" y2="64" stroke="#111111" stroke-width="1.5"/>
    <line x1="880" y1="58" x2="880" y2="70" stroke="#111111" stroke-width="1.5"/>
    <line x1="1130" y1="58" x2="1130" y2="70" stroke="#111111" stroke-width="1.5"/>
    <rect x="953" y="52" width="104" height="24" fill="#F7F7F5"/>
    <text x="1005" y="69" text-anchor="middle">Yours</text>
  </g>

  <!-- connectors -->
  <g stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="290" y1="200" x2="318" y2="200"/>
    <line x1="570" y1="200" x2="598" y2="200"/>
    <line x1="850" y1="200" x2="878" y2="200"/>
  </g>

  <!-- 1 · watch -->
  <g transform="translate(40,110)">
    <rect width="250" height="180" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
    <g transform="translate(101,22)">
      <rect x="14" y="0" width="20" height="9" rx="2" class="ink"/>
      <rect x="14" y="43" width="20" height="9" rx="2" class="ink"/>
      <rect x="4" y="9" width="40" height="34" rx="9" class="ink"/>
      <rect x="18" y="20" width="12" height="12" rx="2" fill="#DA1E28"/>
    </g>
    <text class="t title" x="125" y="112" text-anchor="middle">Press record</text>
    <text class="t sub" x="125" y="138" text-anchor="middle">on the watch you already wear</text>
    <text class="t sub" x="125" y="158" text-anchor="middle">Galaxy Watch · Apple Watch</text>
  </g>

  <!-- 2 · phone -->
  <g transform="translate(320,110)">
    <rect width="250" height="180" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
    <g transform="translate(110,20)">
      <rect x="0" y="0" width="30" height="54" rx="6" class="ink"/>
      <line x1="11" y1="6" x2="19" y2="6" class="ink"/>
      <circle cx="15" cy="46" r="1.8" fill="#111111"/>
    </g>
    <text class="t title" x="125" y="112" text-anchor="middle">Hands off to your phone</text>
    <text class="t sub" x="125" y="138" text-anchor="middle">over Bluetooth, and nowhere else</text>
    <text class="t sub" x="125" y="158" text-anchor="middle">Android · iPhone</text>
  </g>

  <!-- 3 · drive + transcript -->
  <g transform="translate(600,110)">
    <rect width="250" height="180" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
    <g transform="translate(81,22)">
      <!-- cloud -->
      <path d="M14,44 h34 a12,12 0 0 0 1,-24 a16,16 0 0 0 -31,-4 a11,11 0 0 0 -4,28 z" class="ink"/>
      <!-- document -->
      <g transform="translate(52,6)">
        <path d="M0,0 h22 l12,12 v38 h-34 z" fill="#FFFFFF" class="ink"/>
        <path d="M22,0 v12 h12" class="ink"/>
        <line x1="8" y1="24" x2="26" y2="24" class="ink"/>
        <line x1="8" y1="33" x2="26" y2="33" class="ink"/>
        <line x1="8" y1="42" x2="19" y2="42" class="ink"/>
      </g>
    </g>
    <text class="t title" x="125" y="112" text-anchor="middle">Uploads and transcribes</text>
    <text class="t sub" x="125" y="138" text-anchor="middle">audio and transcript in your Drive,</text>
    <text class="t sub" x="125" y="158" text-anchor="middle">with your own speech-to-text key</text>
  </g>

  <!-- 4 · your AI -->
  <g transform="translate(880,110)">
    <rect width="250" height="180" rx="12" fill="#FFFFFF" stroke="#DA1E28" stroke-width="2.5"/>
    <g transform="translate(97,18)">
      <path d="M28,0 c2,14 8,20 22,22 c-14,2 -20,8 -22,22 c-2,-14 -8,-20 -22,-22 c14,-2 20,-8 22,-22 z" fill="#DA1E28"/>
      <path d="M8,34 c1,7 4,10 11,11 c-7,1 -10,4 -11,11 c-1,-7 -4,-10 -11,-11 c7,-1 10,-4 11,-11 z" fill="#DA1E28"/>
    </g>
    <text class="t title" x="125" y="112" text-anchor="middle">Anything, with your own AI</text>
    <text class="t sub" x="125" y="138" text-anchor="middle">Claude, ChatGPT or Codex reads it</text>
    <text class="t sub" x="125" y="158" text-anchor="middle">minutes, decisions, notes in Notion</text>
  </g>

  <text class="t note" x="600" y="342" text-anchor="middle">Or start on the phone itself, or on your Mac or Windows PC, which capture both sides of a call. No Recly server anywhere on this path.</text>
</svg>
