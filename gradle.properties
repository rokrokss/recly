# The core's six Kotlin/Native release links run side by side in this daemon (apple/scripts/build-core.sh);
# with 3g three of them ran out of heap. 8g measured 3m19s for all six (2026-10-15, M4 Pro 24 GB).
org.gradle.jvmargs=-Xmx8g
org.gradle.caching=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
# windows/app: jpackage refuses Homebrew's JDK by default (compose-multiplatform#3107), and the
# toolchain this repo is pinned to is Homebrew's openjdk@21. The DMG it builds here is only the
# development host's check that packaging runs (M6-L1 "Environment constraints"); the shipped MSI
# is built on Windows with its own JDK.
compose.desktop.packaging.checkJdkVendor=false
