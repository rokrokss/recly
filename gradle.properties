org.gradle.jvmargs=-Xmx3g
org.gradle.caching=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
# windows/app: jpackage refuses Homebrew's JDK by default (compose-multiplatform#3107), and the
# toolchain this repo is pinned to is Homebrew's openjdk@21. The DMG it builds here is only the
# development host's check that packaging runs (M6-L1 "환경 제약"); the shipped MSI is built on
# Windows with its own JDK.
compose.desktop.packaging.checkJdkVendor=false
