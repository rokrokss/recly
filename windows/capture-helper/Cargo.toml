[package]
name = "recly-capture-helper"
version = "0.0.1-dev"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Recly Windows capture helper (docs/14): WASAPI mic + loopback, drift, segments, mic-in-use detection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# Everything Windows-only lives behind `cfg(windows)`; the development host is macOS, where this
# crate builds and tests without it (docs/lanes/M6-L2 "환경 제약").
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    # `KSDATAFORMAT_SUBTYPE_*` and the `WAVE_FORMAT_*` tags the mix format is read through.
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # `IMMDevice::Activate` takes a `PROPVARIANT`, which needs both of these.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
]

[profile.release]
strip = true
