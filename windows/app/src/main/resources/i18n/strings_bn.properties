consent.body=মিটিংয়ের অন্যরা এই রেকর্ডিংয়ের কোনো সংকেত পান না। তাদের জানানো রেকর্ডকারীর দায়িত্ব।\n\nকোরিয়া — আপনি যে কথোপকথনে অংশ নিচ্ছেন তা রেকর্ড করতে পারেন (যে কথোপকথনে আপনি নেই তা রেকর্ড করা নিষিদ্ধ)।\nযুক্তরাষ্ট্র — CA·CT·FL·HI·IL·MD·MA·MT·NH·OR·PA·WA-তে প্রত্যেক অংশগ্রহণকারীর সম্মতি প্রয়োজন।\nEU — GDPR অবহিত করা ও আইনসম্মত ভিত্তি চায়, এবং ডেনমার্কে ব্যবসায়িক কলের জন্য স্পষ্ট সম্মতি আবশ্যক।
