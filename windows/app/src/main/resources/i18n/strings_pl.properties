consent.body=To nagrywanie nie daje innym uczestnikom spotkania żadnego sygnału. Poinformowanie ich należy do osoby, która nagrywa.\n\nKorea — możesz nagrywać rozmowę, w której uczestniczysz (nagrywanie rozmowy, w której nie uczestniczysz, jest zabronione).\nStany Zjednoczone — CA·CT·FL·HI·IL·MD·MA·MT·NH·OR·PA·WA wymagają zgody wszystkich uczestników.\nUE — RODO wymaga poinformowania i podstawy prawnej, a Dania wymaga wyraźnej zgody w przypadku rozmów służbowych.
