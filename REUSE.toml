version = 1

# Everything in this repository except the store badges is Recly's own work. Rather than an SPDX
# header in every source file, one annotation covers the tree; `closest` lets a file that carries
# its own header win.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Hyungrok Kim"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The App Store and Google Play badges are Apple's and Google's artwork, used as their guidelines
# allow (THIRD-PARTY-NOTICES.md "Store badges"); they are not under Recly's licence.
[[annotations]]
path = "docs/design/badges/**"
precedence = "override"
SPDX-FileCopyrightText = ["Apple Inc.", "Google LLC"]
SPDX-License-Identifier = "LicenseRef-store-badge-guidelines"
