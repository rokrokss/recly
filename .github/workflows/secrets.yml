# Keys that must never be committed (AGENTS.md "Never commit OAuth client files or keys"): the
# gitignored client files, keystores and the desktop update signing key by name, and keys inside any
# file over the whole history with gitleaks. Test fixtures it flags are listed in .gitleaksignore.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No client files or keystores
        run: |
          found=$(git ls-files | grep -E '(^|/)(google-services\.json|GoogleService-Info\.plist|client_secret[^/]*\.json|[^/]*\.(keystore|jks|p12)|update-signing\.key)$|^apple/Config/Local\.xcconfig$|(^|/)\.env(\..+)?$' || true)
          if [ -n "$found" ]; then
            echo "::error::These files must never be committed:"
            echo "$found"
            exit 1
          fi

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
