# docs/lanes/M6-L2 "Windows 검증은 CI로": the development machine is macOS and there is no Windows PC,
# so the parts of docs/20 S8 a machine can answer without a microphone are answered here.
#
# What this proves that macOS cannot: the helper links against the real WASAPI, Media Foundation and
# audio-session imports (a `cargo check --target x86_64-pc-windows-msvc` on the development host
# never links), and `--self-test` says whether Media Foundation's AAC encoder will take ADR-006's
# format — the evidence behind ADR-019. What it still cannot prove is in docs/20 "Windows 보류 항목".
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-helper:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/capture-helper
    steps:
      - uses: actions/checkout@v4

      # bash rather than the runner's default pwsh: `set -e` is what makes a two-line step fail on
      # the first line rather than the last.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - run: cargo test

      - run: cargo build --release

      # A runner has no audio endpoint, so the endpoint lines are expected to say so. The encoder
      # lines are the point — they are what docs/20 S8 asks and what ADR-019 rests on.
      - name: Self-test (docs/20 S8, encoder half)
        run: ./target/release/recly-capture-helper.exe --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: recly-capture-helper
          path: windows/capture-helper/target/release/recly-capture-helper.exe
          if-no-files-found: error

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The M6-L1 done condition, on Windows. The protocol tests run against `dev/FakeHelper.java`
      # here: pointing them at the helper binary is a development-host affordance
      # (`FakeHelperCommand`), not something CI needs to build a JDK and a Rust toolchain for.
      - run: ./gradlew :windows:app:test
        shell: bash

  # docs/14 N7 · M6-L3 deliverable 4: the MSI, with the helper and ffmpeg in it. This is the only
  # machine that can build one — `jpackage` needs WiX and a Windows host — so the development host's
  # `packageDistributionForCurrentOS` builds a DMG instead and this job is the real check.
  #
  # What it verifies: the resources jpackage is told to carry are there and land in the installer,
  # the `nativeDistributions` block (modules, upgrade UUID, per-user install) is one WiX accepts, and
  # the MSI comes out as an artifact. What it cannot: SmartScreen, and installing it — docs/20
  # "Windows 보류 항목".
  msi:
    runs-on: windows-latest
    needs: capture-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The `capture-helper` job's release build, into the directory `appResourcesRootDir` points at.
      - uses: actions/download-artifact@v4
        with:
          name: recly-capture-helper
          path: windows/app/resources/windows-x64

      # ADR-019: an **LGPL** shared build (`--disable-gpl --disable-nonfree`), which is what
      # `windows/app/resources/common/THIRD-PARTY-ffmpeg.md` says is in here. The GPL builds from the
      # same place are not usable for a distributed app.
      - name: Bundle ffmpeg (ADR-019)
        shell: bash
        run: |
          set -e
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip
          curl -fsSL -o ffmpeg.zip "$url"
          # 7-Zip rather than unzip: it is on the runner's PATH and `unzip` is not guaranteed to be.
          7z x -y -offmpeg-build ffmpeg.zip > /dev/null
          bin=$(dirname "$(find ffmpeg-build -name ffmpeg.exe | head -1)")
          cp "$bin/ffmpeg.exe" windows/app/resources/windows-x64/
          # The shared build's DLLs have to sit next to the exe, which is where the app looks for it.
          cp "$bin"/*.dll windows/app/resources/windows-x64/
          ls -l windows/app/resources/windows-x64

      # jpackage shells out to WiX 3 (`candle`/`light`) and finds it on PATH or not at all.
      - name: WiX 3 on PATH
        shell: bash
        run: |
          set -e
          if command -v candle.exe >/dev/null 2>&1; then
            echo "candle.exe already on PATH"
            exit 0
          fi
          found=$(find "/c/Program Files (x86)" -maxdepth 3 -name candle.exe 2>/dev/null | head -1 || true)
          if [ -z "$found" ]; then
            choco install wixtoolset -y --no-progress
            found=$(find "/c/Program Files (x86)" -maxdepth 3 -name candle.exe 2>/dev/null | head -1)
          fi
          test -n "$found"
          cygpath -w "$(dirname "$found")" >> "$GITHUB_PATH"

      - run: ./gradlew :windows:app:packageMsi
        shell: bash

      # Skipped, not failed, when the repository has no signing credentials — see the script.
      - name: Sign (docs/14 N7)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $msi = Get-ChildItem windows/app/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'packageMsi produced no MSI' }
          ./windows/scripts/sign-msi.ps1 -Msi $msi.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: recly-msi
          path: windows/app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
